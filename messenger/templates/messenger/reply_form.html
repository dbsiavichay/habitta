<form action="{% url 'add_message' %}" method="POST" class="custom-form" style="margin-top: 25px">
    {% csrf_token %}
    <fieldset>                       
        {{ form.content }}
    </fieldset>
    {% for hidden in form.hidden_fields %}
    {{ hidden }}
    {% endfor %}    
    <button type="submit" class="btn big-btn color-bg flat-btn">Enviar<i class="fa fa-paper-plane-o" aria-hidden="true"></i></button>
</form>
