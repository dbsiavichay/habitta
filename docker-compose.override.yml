# Ajustes de desarrollo (docker compose los aplica automáticamente).
services:
  web:
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    # runserver de daphne: HTTP + WebSocket con recarga automática
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
      - ./media:/app/media

  # Recompila static/css/habitta.css al cambiar plantillas, componentes o assets/tailwind/source.css.
  # La primera vez descarga el CLI de Tailwind en .django_tailwind_cli/ (ignorado por git).
  tailwind:
    image: habitta-web
    command: ["python", "manage.py", "tailwind", "watch", "--noreload"]
    env_file:
      - path: .env.docker
        required: false
    environment:
      DEBUG: "True"
    entrypoint: []
    # Misma imagen que web, pero aquí no hay servidor HTTP que chequear.
    healthcheck:
      disable: true
    volumes:
      - .:/app
    # El CLI de Tailwind termina el modo watch si stdin se cierra; así sigue vivo en segundo plano.
    stdin_open: true
    tty: true
    depends_on:
      - web
