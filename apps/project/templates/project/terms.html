{% extends 'base/base.html' %}

{% block content %}
<!--section -->
<section class="parallax-section parallax-sm" data-scrollax-parent="true" id="sec1">
    <div class="bg par-elem " data-bg="{% if project.term_cover %} {{ project.term_cover.url }} {% endif %}" data-scrollax="properties: { translateY: '30%' }"></div>
    <div class="overlay"></div>
    <div class="container">
        <div class="section-title center-align no-padding">
            <h2><span>Términos y condiciones de servicio</span></h2>
            <div class="breadcrumbs fl-wrap"><a href="{% url 'home' %}">Inicio</a><span>Términos y condiciones</span></div>
            <span class="section-separator"></span>
        </div>
    </div>
</section>
<!-- section end -->
<!--section -->
<section class="terms-container">
    <div class="container">        
        <!--about-wrap --> 
        {% for term in object_list %}
        <div class="about-wrap">
        	<div class="list-single-main-item-title fl-wrap">
                <h3>{{ term.title }}</h3>                
                <span class="section-separator fl-sec-sep"></span>
            </div>
            <p>{{ term.description|linebreaks }}</p>                               
        </div>
        {% endfor %}
        <!-- about-wrap end  -->         
    </div>
</section>
<!-- section end -->
{% endblock %}
