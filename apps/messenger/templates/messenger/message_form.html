<!--box-widget-item -->
<div class="box-widget-item fl-wrap">
    <div class="box-widget-item-header">
        <h3>Deja un mensaje : </h3>
    </div>
    <div class="box-widget">
        <div class="box-widget-content">
        {% if user.is_authenticated %}                        
        <!-- Review Comment -->
        <form action="{% url 'add_message' %}" method="POST" class="custom-form">
            {% csrf_token %}
            <fieldset>                       
                {{ form.content }}
            </fieldset>
            {% for hidden in form.hidden_fields %}
            {{ hidden }}
            {% endfor %}           
            <button type="submit" class="btn big-btn  color-bg flat-btn">Enviar<i class="fa fa-paper-plane-o" aria-hidden="true"></i></button>
        </form>
        {% else %}
        <div class="soc-log fl-wrap">
            <p>Ingresa para dejar mensajes.</p>
            <a href="#" id="facebook" class="facebook-log"><i class="fa fa-facebook-official"></i>Entra con Facebook</a>
            <a href="#" id="twitter" class="twitter-log"><i class="fa fa-twitter"></i>Entra con Twitter</a>
            <form id="socialForm" action="{% url 'social_login' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" id="socialProvider" name="provider">
                <input type="hidden" id="socialToken" name="token">
                <input type="hidden" name="next" value="{{ request.path }}">
            </form>
        </div>
        {% endif %}
        </div>
    </div>
</div>
<!--box-widget-item end -->
