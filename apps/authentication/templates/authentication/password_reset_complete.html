{% extends 'base/base.html' %}

{% load static %}

{% block content %}
<div>
    <!--  content  --> 
    <div class="content">
        <!--  section  --> 
        <section class="parallax-section" data-scrollax-parent="true" id="sec1">
            <div class="bg par-elem "  data-bg="{% static 'images/bg/bg.jpg' %}" data-scrollax="properties: { translateY: '30%' }"></div>
            <div class="overlay"></div>
            <div class="bubble-bg"></div>
            <div class="container">
                <div class="error-wrap">
                    <h2 style="font-size: 25px; letter-spacing: 2px;margin-bottom: 25px;">Restablecimiento de contraseña completado.</h2>
                    <p>Su contraseña ha sido establecida. Ahora puede seguir adelante e iniciar sesión.</p>
                    <div class="clearfix"></div>                    
                    <a href="{% url 'login' %}" class="btn big-btn color-bg flat-btn">Iniciar sesión<i class="fa fa-angle-right"></i></a>
                </div>
            </div>
        </section>
        <!--  section  end--> 
    </div>
    <!--  content end  --> 
</div>
{% endblock %}
