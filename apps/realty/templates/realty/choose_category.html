{% extends 'base/base.html' %}

{% load static components %}

{% block css %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'plugins/fontcategories/fontcategories.css' %}">
{% endblock %}

{% block content %}
<!--section -->
<section id="sec1">
    <!-- container -->
    <div class="container">
        <!-- profile-edit-wrap -->
        <div class="profile-edit-wrap">
            <div class="profile-edit-page-header">
                <h2>Escoge una categoría</h2>
                <div class="breadcrumbs"><a href="{% url 'home' %}">Inicio</a><span>Selección de categoría</span></div>
            </div>
            <div class="row">
                <div class="col-xs-6 col-sm-3 col-md-2">
                    <!--box-cat-->
                    <a href="{% url 'add_property' 1 %}?kind=2" class="box-cat">
                        <i class="fc-servicios"></i>
                        <h4 class="name">Servicio</h4>
                    </a>
                    <!--box-cat end-->
                </div>
                {% for category in object_list %}
                 <div class="col-xs-6 col-sm-3 col-md-2">
                    <!--box-cat-->
                    <a href="{% url 'add_property' category.pk %}" class="box-cat">
                        <i class="fc-{{ category.icon }}"></i>
                        <h4 class="name">{{ category|truncatechars:"15" }}</h4>
                    </a>
                    <!--box-cat end-->
               </div>
                {% endfor %}
            </div>
        </div>
        <!--profile-edit-wrap end -->
    </div>
    <!--container end -->
</section>
<!-- section end -->
{% endblock %}
