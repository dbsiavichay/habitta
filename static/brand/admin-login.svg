<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Panel de marca del login del admin: mismos ingredientes que el aside de layouts/auth.html
       (fondo neutral, halos primary/accent/secondary y retícula de puntos) más el símbolo de la casa. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff"/></pattern>
  </defs>
  <rect width="900" height="1200" fill="#13211e"/>
  <g filter="url(#blur)">
    <circle cx="140" cy="160" r="300" fill="#0b6e5f" opacity=".75"/>
    <circle cx="820" cy="520" r="220" fill="#f2b544" opacity=".22"/>
    <circle cx="380" cy="1120" r="280" fill="#c8502e" opacity=".3"/>
  </g>
  <rect width="900" height="1200" fill="url(#dots)" opacity=".07"/>
  <g transform="translate(450 600) scale(5.2) translate(-32 -32)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".14">
    <path d="M12 32.5 32 13.5l20 19"/>
    <path d="M20 26.5V50M44 26.5V50M20 39h24"/>
  </g>
  <circle cx="450" cy="584" r="18.7" fill="#f2b544" opacity=".9"/>
</svg>
