# Stack local. En desarrollo se combina automáticamente con docker-compose.override.yml.
# La producción real (VPS) usa deploy/compose.yml: ver deploy/README.md.
name: habitta

services:
  db:
    # Imagen multi-arquitectura (amd64/arm64) mantenida por el equipo de docker-postgis.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: habitta
      POSTGRES_USER: habitta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitta}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/initdb/20-restore.sh:/docker-entrypoint-initdb.d/20-restore.sh:ro
      # Dump opcional: si no existe, la base arranca vacía.
      - ${DUMP_PATH:-./backups/seed-2020-04-27.pgsql}:/dump/initial.pgsql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U habitta -d habitta"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: habitta-web
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgis://habitta:${POSTGRES_PASSWORD:-habitta}@db:5432/habitta
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
