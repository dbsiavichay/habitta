{% if is_paid %}
<a href="{% url 'download_property' object.id %}" class="btn color-bg flat-btn">Descargar
    <i class="fa fa-download"></i>
</a>
{% else %}
<a href="{% url 'select_method_payment' object.id content_type.id %}" class="btn color-bg flat-btn">
    Comprar ${{ object.price }}
</a>
{% endif %}
