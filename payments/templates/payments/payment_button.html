
{% if render %} 
{% if is_paid %}
<a href="{% url 'download_property' property.id %}" class="btn big-btn color-bg flat-btn">Descargar
    <i class="fa fa-download"></i>

    Comprar ${{ property.price }}
</a>

{% endif %}
