<!--register form -->
<div id="deleteServiceModal" class="modal">
    <div class="main-overlay"></div>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-close"><i class="fa fa-times"></i></div>
                <h3>Confirmación</h3>                
            </div>

            <div class="modal-body">
                <p>* ¿Esta seguro de eliminar este registro? Recuerde que esta acción es irreversible.</p>
            </div>

            <div class="modal-footer">
                <form method="POST" action="" id="deleteServiceForm">
                    {% csrf_token %}
                    <button type="submit"  class="btn-primary"><span>Aceptar</span></button>                
                </form> 
            </div>
        </div>
    </div>
</div>
<!--register form end -->
