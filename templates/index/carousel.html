<!-- carousel -->
<div class="list-carousel fl-wrap card-listing ">
    <!--listing-carousel-->
    <div class="listing-carousel  fl-wrap ">
        {% for object in object_list %}
        <!--slick-slide-item-->
        <div class="slick-slide-item">
            <!-- listing-item -->
            <div class="listing-item">
                <article class="geodir-category-listing fl-wrap">
                    <div class="geodir-category-img">
                        <img src="{{ object.get_cover }}" alt="">
                        <div class="overlay"></div>
                        <div class="list-post-counter"><span>4</span><i class="fa fa-heart"></i></div>
                    </div>
                    <div class="geodir-category-content fl-wrap">
                        <a class="listing-geodir-category" href="listing.html">{{ object.category.singular_name }}</a>
                        <div class="listing-avatar"><a href="{% url 'detail_profile' object.user.username %}"><img src="{{ object.user.profile.get_avatar }}" alt=""></a>
                            <span class="avatar-tooltip">Publicado por  <strong>{{ object.user.get_full_name }}</strong></span>
                        </div>
                        <h3><a href="{{ object.get_absolute_url }}">$ {{ object.get_price_area }}</a></h3>
                        <p>{{ object.title|lower|capfirst }}</p>
                        <div class="geodir-category-options fl-wrap">
                            <div class="listing-rating card-popup-rainingvis" data-starrating2="5">
                                <span>(7 reviews)</span>
                            </div>
                            <div class="geodir-category-location"><a href="#"><i class="fa fa-map-marker" aria-hidden="true"></i>{{ object.address|truncatechars:38 }}</a></div>
                        </div>
                    </div>
                </article>
            </div>
            <!-- listing-item end-->
        </div>
        <!--slick-slide-item end-->
        {% endfor %}
        
    </div>
    <!--listing-carousel end-->
    <div class="swiper-button-prev sw-btn"><i class="fa fa-long-arrow-left"></i></div>
    <div class="swiper-button-next sw-btn"><i class="fa fa-long-arrow-right"></i></div>
</div>
<!--  carousel end-->
