<!-- list-single-main-item --> 
<div class="list-single-main-item fl-wrap" id="sec4">
    <div class="list-single-main-item-title fl-wrap">
        <h3>Comentarios -  <span> {{ comments.count }} </span></h3>
    </div>
    <div class="reviews-comments-wrap">
        {% for comment in comments %}
        <!-- reviews-comments-item -->  
        <div class="reviews-comments-item">
            <div class="review-comments-avatar">
                <img src="{{ comment.user.profile.get_avatar }}" alt=""> 
            </div>
            <div class="reviews-comments-item-text">
                <h4><a href="#">{{ comment.user.get_full_name }}</a></h4>                
                <div class="clearfix"></div>
                <p>"{{ comment.content }}"</p>
                <span class="reviews-comments-item-date"><i class="fa fa-calendar-check-o"></i>{{ comment.date }}</span>
            </div>
        </div>
        <!--reviews-comments-item end-->
        {% endfor %}
    </div>
</div>
<!-- list-single-main-item end -->
