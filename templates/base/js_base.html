<script>
document.getElementById('id_search_purpose').addEventListener('change', function() {
    var pk = this.value;
    klass = this.getAttribute('class').split(' ')[0]
    $.get('/realty/finder/purpose/' + pk + '/' + klass + '/', function (data){
        var container = document.getElementById('search-category');
        container.innerText = '';
        container.insertAdjacentHTML('afterbegin', data.select);
        if(window.hasOwnProperty('Choices')) {
	        new Choices('#id_search_category', {
	            itemSelectText: '',
	            shouldSort: false,                    
	        });        	
        }
        $('#id_search_category').niceSelect();
    })
});
</script>
