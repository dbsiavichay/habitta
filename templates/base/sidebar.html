{% load messenger %}
<div class="fixed-bar fl-wrap">
    <div class="user-profile-menu-wrap fl-wrap">
        <!-- user-profile-menu-->
        <div class="user-profile-menu">
            <h3>Principal</h3>
            <ul>
                <li><a {% if 'profile/update' in request.path %} class="user-profile-act" {% endif %} href="{% url 'update_profile' %}"><i class="fa fa-user-o"></i> Editar perfil</a></li>
                <li><a {% if 'password' in request.path %} class="user-profile-act" {% endif %} href="{% url 'change_password' %}"><i class="fa fa-unlock-alt"></i>Cambiar contraseña</a></li>
                <li><a href="{% url 'conversations' %}"><i class="fa fa-envelope-o"></i> Conversaciones <span>{% get_conversations_count user %}</span></a></li>
            </ul>
        </div>
        <!-- user-profile-menu end-->

        <!-- user-profile-menu-->
        <div class="user-profile-menu">
            <h3>Pagos</h3>
            <ul>
                <li>
                    <a {% if 'payments/bank' in request.path %} class="user-profile-act" {% endif %} href="{% url 'list_bank_payment' %}"><i class="fa fa-th-list"></i> Mis pagos</a>
                </li>
                <li>
                    <a {% if 'payments/downloads' in request.path %} class="user-profile-act" {% endif %} href="{% url 'downloads' %}"><i class="fa fa-download"></i> Descargas  </a>
                </li>
            </ul>
        </div>
        <!-- user-profile-menu end-->

        <!-- user-profile-menu-->
        <div class="user-profile-menu">
            <h3>Subastas</h3>
            <ul>
                <li>
                    <a {% if 'auction/add' in request.path %} class="user-profile-act" {% endif %} href="{% url 'add_auction' %}"><i class="fa fa-th-list"></i> Crear subasta </a>
                </li>
                <li>
                    <a {% if 'auctions' in request.path %} class="user-profile-act" {% endif %} href="{% url 'auctions' %}"><i class="fa fa-th-list"></i> Subastas  </a>
                </li>
            </ul>
        </div>
        <!-- user-profile-menu end-->

        <!-- user-profile-menu-->
        <div class="user-profile-menu">
            <h3>Publicaciones</h3>
            <ul>
                <li><a {% if 'realty/properties' in request.path %} class="user-profile-act" {% endif %} href="{% url 'properties' %}"><i class="fa fa-th-list"></i> Mis publicaciones  </a></li>                                
                <li><a {% if 'favorite' in request.path %} class="user-profile-act" {% endif %} href="{% url 'favorite_properties' %}"><i class="fa fa-heart"></i> Favoritos </a></li>
                <li><a href="{% url 'choose_category' %}" {% if 'property' in request.path %} class="user-profile-act" {% endif %}><i class="fa fa-plus-square-o"></i> Publicar</a></li>
            </ul>
        </div>
        <!-- user-profile-menu end-->                                        
        <a href="{% url 'logout' %}" data-logout class="log-out-btn">Cerrar sesión</a>
    </div>
</div>
