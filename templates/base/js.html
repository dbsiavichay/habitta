<!-- Search bar -->
<script>   
    $(function () {
        $('#id_search_purpose').on('change', function () {
            var pk = this.value;            
            klass = this.getAttribute('class').split(' ')[0]
            $.get('/realty/finder/purpose/' + pk + '/' + klass + '/', function (data){
                var container = $('#id_search_category').parent();
                container.text('');
                container.html(data.select)
                $('#id_search_category').niceSelect();
            })
        });
    });
</script>

<script type="text/javascript">
    $(function () {
        /*Cards*/
        $('.listing-item').on('click', function () {
            window.location.href = $(this).data('url');
        });
        /* Forms */
        function render_details_form() {
            $.get('/realty/render/detalles-de-categoria/' + this.value + '/', function (data) {
                var container = document.getElementById('details-form');
                container.innerHTML = '';
                container.insertAdjacentHTML('afterbegin', data.form);
                $(container).find('.chosen-select').niceSelect();
            });
        }

        $('#id_category').on('change', render_details_form);
    });
</script>

<!-- Detail -->
<script type="text/javascript" src="{% static 'js/gallery-upload-image.js' %}"></script>
<script type="text/javascript" src="{% static 'js/reactions.js' %}"></script>
<script>
    var receiver = document.querySelector('#owner').value;
    var chatSocket = new WebSocket(
        'wss://' + window.location.host +
        '/ws/message/' + receiver + '/', );


    chatSocket.onmessage = function(e) {
        var data = JSON.parse(e.data);
        var message = data['message'];
        document.querySelector('.chat-body').insertAdjacentHTML('beforeend', message)
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('.chat-widget_input textarea').onkeyup = function(e) {
        if (e.keyCode === 13) {  // enter, return
            document.querySelector('.chat-widget_input button').click();
        }
    };

    document.querySelector('.chat-widget_input button').onclick = function(e) {
        var messageInputDom = document.querySelector('.chat-widget_input textarea');
        var receiverInputDom = document.querySelector('#owner');
        var message = messageInputDom.value;
        var receiver = receiverInputDom.value;
        chatSocket.send(JSON.stringify({
            'message': message,
            'receiver': receiver,
        }));

        messageInputDom.value = '';
    };
</script>
