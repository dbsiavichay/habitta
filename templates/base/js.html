<!-- Search bar -->
<script>   
    $(function () {
        $('#id_search_purpose').on('change', function () {
            var pk = this.value;            
            klass = this.getAttribute('class').split(' ')[0]
            $.get('/realty/finder/purpose/' + pk + '/' + klass + '/', function (data){
                var container = $('#id_search_category').parent();
                container.text('');
                container.html(data.select)
                $('#id_search_category').niceSelect();
            })
        });
    });
</script>

<script type="text/javascript">

            window.location.href = $(this).data('url');
        });
    });
</script>

<!-- QR Code Reader -->
<script type="text/javascript" src="{% static 'plugins/qrcode-reader/instascan.min.js' %}"></script>
<script>
    $(function () {

        var scan = function () {
            let scanner = new Instascan.Scanner({ video: document.getElementById('qr-reader') });
            scanner.addListener('scan', function (content) {
                // Sólo se siguen códigos QR que apunten a este mismo sitio.
                try {
                    var target = new URL(content, window.location.origin);
                    if (target.origin === window.location.origin) window.location.href = target.href;
                } catch (e) {}
            });
            Instascan.Camera.getCameras().then(function (cameras) {                
                if (cameras.length > 0) {
                  scanner.start(cameras[cameras.length-1]);
                } else {
                  console.error('No cameras found.');
                }
            }).catch(function (e) {
                console.error(e);
            });
        }


        $('#btn-qrcode').on('click', function () {
            scan();
            $('#qrcode-modal').fadeIn();
        });

    });
</script>

<!-- Logout por POST (Django 5 no admite GET) -->
<script>
    document.addEventListener('click', function (e) {
        var link = e.target.closest('[data-logout]');
        var form = document.getElementById('logout-form');
        if (link && form) {
            e.preventDefault();
            form.submit();
        }
    });
</script>
