{% comment %}
Estado vacío amable, con ilustración y acción.
  <c-empty-state icon="search-x" title="Sin resultados" text="Prueba con otros filtros.">
      <c-button href="...">Publicar</c-button>
  </c-empty-state>
{% endcomment %}
<c-vars icon="sparkles" title="" text="" class="" />
<div class="flex flex-col items-center text-center px-6 py-14 {{ class }}">
    <div class="relative mb-5">
        <div class="absolute inset-0 rounded-full bg-primary/15 blur-xl"></div>
        <div class="relative grid place-items-center size-16 rounded-2xl bg-base-100 text-primary shadow-soft ring-1 ring-base-300">
            <c-icon name="{{ icon }}" class="size-7" />
        </div>
    </div>
    <h3 class="text-xl font-bold">{{ title }}</h3>
    {% if text %}<p class="mt-2 max-w-md text-base-content/70">{{ text }}</p>{% endif %}
    {% if slot %}<div class="mt-6 flex flex-wrap justify-center gap-3">{{ slot }}</div>{% endif %}
</div>
