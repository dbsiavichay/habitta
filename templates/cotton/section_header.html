{% comment %}
Encabezado de sección: antetítulo, título, descripción y acción opcional a la derecha.
  <c-section-header eyebrow="Recientes" title="Lo último publicado" href="{% url 'finder' %}" link="Ver todo" />
{% endcomment %}
<c-vars eyebrow="" title="" description="" href="" link="Ver todo" center="" class="" />
<div class="flex flex-wrap items-end justify-between gap-4 mb-8 {% if center %}flex-col items-center text-center{% endif %} {{ class }}">
    <div class="{% if center %}max-w-2xl{% else %}max-w-3xl{% endif %}">
        {% if eyebrow %}<p class="text-sm font-bold uppercase tracking-[0.14em] text-secondary mb-2">{{ eyebrow }}</p>{% endif %}
        <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">{{ title }}</h2>
        {% if description %}<p class="mt-3 text-base-content/70 text-lg">{{ description }}</p>{% endif %}
        {{ slot }}
    </div>
    {% if href %}
    <a href="{{ href }}" class="group inline-flex items-center gap-1.5 font-semibold text-primary hover:gap-2.5 transition-all">
        {{ link }} <c-icon name="arrow-right" class="size-4" />
    </a>
    {% endif %}
</div>
