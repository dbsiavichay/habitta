{% comment %}
Carrusel horizontal con scroll-snap (deslizable con el dedo) y flechas en escritorio.
  <c-carousel label="Recientes">
      {% for p in properties %}<c-carousel.item><c-property.card :property="p" /></c-carousel.item>{% endfor %}
  </c-carousel>
{% endcomment %}
<c-vars label="Anuncios" class="" />
<div x-data="carousel" class="relative {{ class }}" role="region" aria-roledescription="carrusel" aria-label="{{ label }}">
    <div x-ref="track"
         class="-mx-4 flex snap-x snap-mandatory gap-4 overflow-x-auto scroll-px-4 px-4 pb-6 pt-1 scrollbar-none sm:mx-0 sm:gap-5 sm:scroll-px-0 sm:px-0">
        {{ slot }}
    </div>
    <button type="button" @click="scroll(-1)" x-show="!atStart" x-transition.opacity x-cloak
            class="btn btn-circle absolute -left-5 top-[32%] z-20 hidden border-0 bg-base-100 shadow-float hover:bg-base-100 hover:text-primary sm:inline-flex"
            aria-label="Anteriores">
        <c-icon name="chevron-left" />
    </button>
    <button type="button" @click="scroll(1)" x-show="!atEnd" x-transition.opacity
            class="btn btn-circle absolute -right-5 top-[32%] z-20 hidden border-0 bg-base-100 shadow-float hover:bg-base-100 hover:text-primary sm:inline-flex"
            aria-label="Siguientes">
        <c-icon name="chevron-right" />
    </button>
</div>
