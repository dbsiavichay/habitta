{% comment %}
Chat flotante con un anunciante. Se abre con su botón o con $dispatch('open-chat') desde cualquier parte.
  <c-chat.widget :receiver="object.user" />
  <c-chat.widget :receiver="object.user" :launcher_mobile="False" />   (sin botón flotante en móvil)
El hilo (cabecera, historial y caja de texto) es <c-chat.thread>, el mismo de la página de conversación.
{% endcomment %}
<c-vars receiver="" launcher_mobile="1" />
<div x-data="chatWidget({{ receiver.id }})" @open-chat.window="open || toggle()" @keydown.escape="open = false"
     class="fixed right-4 z-40 bottom-[calc(5.5rem+env(safe-area-inset-bottom))] lg:bottom-6 lg:right-6">
    <section x-show="open" x-transition.origin.bottom.right x-cloak role="dialog" aria-label="Chat con {{ receiver.get_full_name|default:receiver.username }}"
             class="mb-3 flex h-[min(34rem,72dvh)] w-[min(24rem,calc(100vw-2rem))] flex-col overflow-hidden rounded-box bg-base-100 shadow-float ring-1 ring-base-300">
        <c-chat.thread :receiver="receiver">
            <c-slot name="actions">
                <button type="button" class="btn btn-ghost btn-circle btn-sm text-current" @click="open = false" aria-label="Cerrar chat"><c-icon name="x" /></button>
            </c-slot>
        </c-chat.thread>
    </section>

    <div class="flex justify-end">
        <button type="button" @click="toggle()" :aria-expanded="open"
                class="btn btn-primary h-14 rounded-full px-5 text-base shadow-float {% if not launcher_mobile %}hidden lg:inline-flex{% endif %}">
            <span x-show="!open" class="inline-flex items-center gap-2"><c-icon name="message-circle" class="size-5" />Chatear</span>
            <span x-show="open" x-cloak class="inline-flex items-center gap-2"><c-icon name="chevron-down" class="size-5" />Cerrar</span>
        </button>
    </div>
</div>
