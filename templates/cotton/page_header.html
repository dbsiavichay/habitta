{% comment %}
Encabezado de páginas interiores (ayuda, términos…): migas, título, descripción y foto de fondo opcional.
  <c-page-header title="Ayuda" description="..." :cover="project.help_cover" :breadcrumbs="crumbs" icon="life-buoy" />
{% endcomment %}
<c-vars title="" description="" cover="" breadcrumbs="" icon="" />
<section class="relative overflow-hidden {% if cover %}bg-neutral text-white{% else %}bg-brand-mesh{% endif %}">
    {% if cover %}
    <img src="{{ cover.url }}" alt="" class="absolute inset-0 size-full object-cover opacity-45" loading="eager" onerror="this.remove()">
    <div class="absolute inset-0 bg-gradient-to-t from-neutral/90 via-neutral/40 to-neutral/10"></div>
    {% endif %}
    <div class="relative container-page pt-10 pb-12 sm:pt-14 sm:pb-16">
        <c-breadcrumbs :items="breadcrumbs" class="{% if cover %}text-white/80{% endif %}" />
        <div class="mt-6 flex items-start gap-4">
            {% if icon %}
            <div class="hidden sm:grid size-14 shrink-0 place-items-center rounded-2xl {% if cover %}bg-white/15 backdrop-blur text-white{% else %}bg-base-100 text-primary shadow-soft{% endif %}">
                <c-icon name="{{ icon }}" class="size-7" />
            </div>
            {% endif %}
            <div class="max-w-3xl">
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight">{{ title }}</h1>
                {% if description %}<p class="mt-3 text-lg {% if cover %}text-white/80{% else %}text-base-content/70{% endif %}">{{ description }}</p>{% endif %}
                {{ slot }}
            </div>
        </div>
    </div>
</section>
