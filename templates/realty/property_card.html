{% load comments %}
<div class="listing-item">
    <article data-url="{{ object.get_absolute_url }}" class="geodir-category-listing fl-wrap">
        <div class="geodir-category-img">
            <img src="{{ object.get_cover }}" alt="">
            <div class="overlay"></div>
            <div class="list-post-counter"><span>4</span><i class="fa fa-heart"></i></div>
        </div>
        <div class="geodir-category-content fl-wrap">
            <span class="listing-geodir-category">
                <i class="fa fa-usd"></i> {{ object.price }}
            </span>
            <div class="listing-avatar"><a href="{% url 'detail_profile' object.user.username %}"><img src="{{ object.user.profile.get_avatar }}" alt=""></a>
                <span class="avatar-tooltip">Publicado por <strong>{{ object.user.get_full_name }}</strong></span>
            </div>
            <h3>
                <div>{{ object.get_purpose.activity }}</div>
                <span>{{ object.category.singular_name}}</span>
            </h3>
            <p>{{ object.description|truncatewords:20 }}</p>
            <div class="geodir-category-options fl-wrap">
                <div class="listing-rating card-popup-rainingvis" data-starrating2="5">
                    <span>({% comments_count object %} comentarios)</span>
                </div>
                <div class="geodir-category-location"><span><i class="fa fa-map-marker" aria-hidden="true"></i>{{ object.address }}</span></div>
            </div>
        </div>
    </article>
</div>
