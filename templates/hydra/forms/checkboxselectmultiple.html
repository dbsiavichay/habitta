{% if field|length %}
<fieldset class="sm:col-span-2">
    <legend class="pb-2 text-sm font-semibold">{{ field.label }}</legend>
    <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        {% for checkbox in field %}
        <label for="{{ checkbox.id_for_label }}" class="flex cursor-pointer items-center gap-3 rounded-field border border-base-300 bg-base-100 px-3 py-2.5 text-sm font-medium transition hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-primary/5">
            <input type="checkbox" name="{{ checkbox.data.name }}" value="{{ checkbox.data.value }}" id="{{ checkbox.id_for_label }}" class="checkbox checkbox-primary checkbox-sm" {% if checkbox.data.selected %}checked{% endif %}>
            {{ checkbox.choice_label }}
        </label>
        {% endfor %}
    </div>
    {% for error in field.errors %}<p class="mt-1 text-sm text-error">{{ error }}</p>{% endfor %}
</fieldset>
{% endif %}
