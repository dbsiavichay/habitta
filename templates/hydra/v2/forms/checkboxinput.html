{% load hydra %}
<label for="{{ field.id_for_label }}" class="flex cursor-pointer items-center justify-between gap-4 rounded-field border border-base-300 bg-base-100 px-4 py-3 transition hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-primary/5">
    <span class="font-semibold">{{ field.label }}</span>
    {{ field|add_class:"toggle toggle-primary" }}
</label>
{% for error in field.errors %}<p class="mt-1 text-sm text-error">{{ error }}</p>{% endfor %}
