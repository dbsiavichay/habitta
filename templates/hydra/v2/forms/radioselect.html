{% comment %}Opciones como "pastillas" seleccionables.{% endcomment %}
<fieldset class="sm:col-span-2">
    <legend class="pb-2 text-sm font-semibold">{{ field.label }}{% if field.field.required %} <span class="text-error" aria-hidden="true">*</span>{% endif %}</legend>
    <div class="flex flex-wrap gap-2">
        {% for radio in field %}
        <label class="cursor-pointer">
            <span class="sr-only">{{ radio.choice_label }}</span>
            <input type="radio" name="{{ radio.data.name }}" value="{{ radio.data.value }}" id="{{ radio.id_for_label }}" class="peer sr-only" {% if radio.data.selected %}checked{% endif %}>
            <span aria-hidden="true" class="inline-flex rounded-full border border-base-300 bg-base-100 px-4 py-2 text-sm font-semibold transition peer-checked:border-primary peer-checked:bg-primary peer-checked:text-primary-content peer-focus-visible:outline-2 peer-focus-visible:outline-primary hover:border-primary/50">{{ radio.choice_label }}</span>
        </label>
        {% endfor %}
    </div>
    {% for error in field.errors %}<p class="mt-1 text-sm text-error">{{ error }}</p>{% endfor %}
</fieldset>
