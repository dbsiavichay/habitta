<!--register form -->
<div class="main-register-wrap modal">
    <div class="main-overlay"></div>
    <div class="main-register-holder">
        <div class="main-register fl-wrap">
            <div class="close-reg"><i class="fa fa-times"></i></div>
            <h3>Entra en <span>City<strong>Book</strong></span></h3>
            <div class="soc-log fl-wrap">
                <p>Facilmente puedes registrarte usando tus redes sociales.</p>
                <a href="#" class="facebook-log"><i class="fa fa-facebook-official"></i>Entra con Facebook</a>
                <a href="#" class="twitter-log"><i class="fa fa-twitter"></i>Entra con Twitter</a>
            </div>
            <div class="log-separator fl-wrap"><span>o</span></div>
            <div id="tabs-container">
                <ul class="tabs-menu">
                    <li class="current"><a href="#tab-1">Inicia sesión</a></li>
                    <li><a href="#tab-2">Registrate</a></li>
                </ul>
                <div class="tab">
                    <div id="tab-1" class="tab-content">
                        <div class="custom-form">
                            <form method="post"  name="registerform">
                                <label>Username or Email Address * </label>
                                <input name="email" type="text"   onClick="this.select()" value="">
                                <label >Password * </label>
                                <input name="password" type="password"   onClick="this.select()" value="" >
                                <button type="submit"  class="log-submit-btn"><span>Entrar</span></button>
                                <div class="clearfix"></div>
                                <div class="filter-tags">
                                    <input id="check-a" type="checkbox" name="check">
                                    <label for="check-a">Recuerdame</label>
                                </div>
                            </form>
                            <div class="lost_password">
                                <a href="#">¿Olvidaste tu contraseña?</a>
                            </div>
                        </div>
                    </div>
                    <div class="tab">
                        <div id="tab-2" class="tab-content">
                            <div class="custom-form">
                                <form method="post"   name="registerform" class="main-register-form" id="main-register-form2">
                                    <label>Email Address *</label>
                                    <input name="email" type="text"  onClick="this.select()" value="">
                                    <label>Username * </label>
                                    <input name="username" type="text" onClick="this.select()" value="">
                                    <label >Password *</label>
                                    <input name="password" type="password"   onClick="this.select()" value="" >
                                    <button type="submit"     class="log-submit-btn"  ><span>Registrarse</span></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--register form end -->
