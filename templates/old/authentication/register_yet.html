{% extends 'base.html' %}

{% load static %}
{% load components %}

{% block 'content' %}
<div>
    <!--  content  --> 
    <div class="content">
        <!--  section  --> 
        <section class="parallax-section" data-scrollax-parent="true" id="sec1">
            <div class="bg par-elem "  data-bg="{% static 'images/bg/bg.jpg' %}" data-scrollax="properties: { translateY: '30%' }"></div>
            <div class="overlay"></div>
            <div class="bubble-bg"></div>
            <div class="container">
                <div class="error-wrap">
                    <h2>Ooops!</h2>
                    <p>Ya estas registrado, debes cerrar sesión primero.</p>
                    <div class="clearfix"></div>                    
                    <p>ó</p>
                    <a href="{% url 'home' %}" class="btn big-btn color-bg flat-btn">Regresa a la página de inicio<i class="fa fa-angle-right"></i></a>
                </div>
            </div>
        </section>
        <!--  section  end--> 
        <!--  section  --> 
        <section class="gradient-bg">
            <div class="cirle-bg">
                <div class="bg" data-bg="{% static 'images/bg/circle.png' %}"></div>
            </div>
            <div class="container">
                <div class="join-wrap fl-wrap">
                    <div class="row">
                        <div class="col-md-8">
                            <h3>Deber cerrar sesión</h3>                            
                        </div>
                        <div class="col-md-4"><a href="{% url 'logout' %}" class="join-wrap-btn">Salir <i class="fa fa-sign-out"></i></a></div>
                    </div>
                </div>
            </div>
        </section>
        <!--  section end --> 
        <div class="limit-box"></div>
    </div>
    <!--  content end  --> 
</div>
{% endblock %}
